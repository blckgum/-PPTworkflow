name: 课程引擎与完整验收

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装引擎与系统渲染工具
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress libreoffice-writer poppler-utils fonts-noto-cjk
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: T1–T4（含真实渲染）
        run: python tests/acceptance.py --render
      - name: 保存验收结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: .validation/acceptance/
          if-no-files-found: ignore
